<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学生数学口算练习</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 主页 -->
        <div id="home-page" class="page active">
            <header class="header">
                <h1 class="title">🎮 小学生数学口算练习</h1>
                <p class="subtitle">边玩边学，快乐成长！</p>
            </header>
            <main class="main-content">
                <div class="feature-cards">
                    <div class="card" onclick="startQuickPractice()">
                        <div class="card-icon">⚡</div>
                        <h2 class="card-title">快速练习</h2>
                        <p class="card-desc">随机生成10道题，快速测试</p>
                    </div>
                    <div class="card" onclick="showExamSettings()">
                        <div class="card-icon">📝</div>
                        <h2 class="card-title">生成试卷</h2>
                        <p class="card-desc">自定义难度和题型，生成完整试卷</p>
                    </div>
                    <div class="card" onclick="showHistory()">
                        <div class="card-icon">📊</div>
                        <h2 class="card-title">练习记录</h2>
                        <p class="card-desc">查看历史练习成绩</p>
                    </div>
                </div>
            </main>
            <footer class="footer">
                <p>🎉 每天进步一点点，数学变得更简单！</p>
            </footer>
        </div>

        <!-- 试卷设置页面 -->
        <div id="exam-settings-page" class="page">
            <header class="header">
                <button class="back-btn" onclick="goHome()">← 返回</button>
                <h1 class="title">试卷设置</h1>
            </header>
            <main class="main-content">
                <div class="settings-form">
                    <div class="form-group">
                        <label for="difficulty">难度级别</label>
                        <select id="difficulty" class="form-control">
                            <option value="easy">简单 (入门级)</option>
                            <option value="medium" selected>中等 (进阶)</option>
                            <option value="hard">困难 (挑战级)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="questionCount">题目数量</label>
                        <select id="questionCount" class="form-control">
                            <option value="10">10 题</option>
                            <option value="20" selected>20 题</option>
                            <option value="30">30 题</option>
                            <option value="50">50 题</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>试题类型 (可多选)</label>
                        <div class="checkbox-group" id="questionTypes">
                            <label class="checkbox-label">
                                <input type="checkbox" value="numberPattern" checked> 数的规律
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="addition" checked> 加法
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="subtraction" checked> 减法
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="mixedAddSub" checked> 多个数加减
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="within500" checked> 500以内加减
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="multiplication" checked> 乘法
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="division" checked> 除法
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="bigMultiplication"> 大数乘法
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="fraction"> 分数入门
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="rounding"> 四舍五入
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" value="clock"> 认识钟表
                            </label>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-large" onclick="generateExam()">
                        🚀 生成试卷
                    </button>
                </div>
            </main>
        </div>

        <!-- 答题页面 -->
        <div id="quiz-page" class="page">
            <header class="header quiz-header">
                <button class="back-btn" onclick="confirmExit()">← 退出</button>
                <div class="progress-info">
                    <span id="currentQuestion">1</span>/<span id="totalQuestions">10</span>
                </div>
                <div class="timer">
                    ⏱️ <span id="timer">00:00</span>
                </div>
            </header>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 10%"></div>
            </div>
            <main class="quiz-content">
                <div id="questionContainer" class="question-container">
                    <!-- 题目内容将通过 JS 动态生成 -->
                </div>
            </main>
            <footer class="quiz-footer">
                <button id="prevBtn" class="btn btn-secondary" onclick="prevQuestion()" disabled>
                    ◀ 上一题
                </button>
                <button id="nextBtn" class="btn btn-primary" onclick="nextQuestion()">
                    下一题 ▶
                </button>
                <button id="submitBtn" class="btn btn-success" onclick="submitQuiz()" style="display: none;">
                    📤 提交试卷
                </button>
            </footer>
        </div>

        <!-- 结果页面 -->
        <div id="result-page" class="page">
            <header class="header">
                <button class="back-btn" onclick="goHome()">← 返回首页</button>
                <h1 class="title">练习结果</h1>
            </header>
            <main class="result-content">
                <div class="result-summary">
                    <div id="resultIcon" class="result-icon">🎉</div>
                    <div class="score-container">
                        <span id="score">100</span>
                        <span class="score-unit">分</span>
                    </div>
                    <div class="result-stats">
                        <div class="stat-item">
                            <span class="stat-label">答对题数</span>
                            <span id="correctCount" class="stat-value">10</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">答错题数</span>
                            <span id="wrongCount" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">用时</span>
                            <span id="timeSpent" class="stat-value">05:30</span>
                        </div>
                    </div>
                </div>
                <div class="answer-review">
                    <h3>📋 答题详情</h3>
                    <div id="answerReview" class="answer-list">
                        <!-- 答题详情将通过 JS 动态生成 -->
                    </div>
                </div>
                <div class="result-actions">
                    <button class="btn btn-primary btn-large" onclick="retryQuiz()">
                        🔄 再练一次
                    </button>
                    <button class="btn btn-secondary btn-large" onclick="reviewWrongAnswers()">
                        📖 查看错题
                    </button>
                </div>
            </main>
        </div>

        <!-- 历史记录页面 -->
        <div id="history-page" class="page">
            <header class="header">
                <button class="back-btn" onclick="goHome()">← 返回</button>
                <h1 class="title">练习记录</h1>
            </header>
            <main class="history-content">
                <div id="historyList" class="history-list">
                    <!-- 历史记录将通过 JS 动态生成 -->
                </div>
                <div id="emptyHistory" class="empty-state" style="display: none;">
                    <div class="empty-icon">📭</div>
                    <p>还没有练习记录，快去做题吧！</p>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript 文件 -->
    <script src="js/question-generator.js"></script>
    <script src="js/exam-generator.js"></script>
    <script src="js/animation-engine.js"></script>
    <script src="js/app.js"></script>
